<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada | Orvalia Studio</title>
  <style>
    :root {
      --bg: #143f3a;
      --accent: #9cf0e4;
      --text: #ffffff;
      --secondary: #d7e6e2;
    }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    .noise {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('https://grainy-gradients.vercel.app/noise.svg');
      opacity: 0.03;
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      padding: 20px;
    }
    h1 {
      font-size: 8rem;
      font-weight: 900;
      margin: 0;
      color: var(--accent);
      opacity: 0.2;
      line-height: 1;
    }
    h2 {
      font-size: 2.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -1px;
      margin: 10px 0;
    }
    p {
      color: var(--secondary);
      opacity: 0.8;
      margin-bottom: 30px;
    }
    a {
      display: inline-block;
      padding: 16px 40px;
      background-color: var(--accent);
      color: var(--bg);
      text-decoration: none;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-radius: 9999px;
      font-size: 0.75rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(156, 240, 228, 0.4);
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="container">
    <h1>404</h1>
    <h2>Página não encontrada</h2>
    <p>O destino que você procura não existe ou foi movido.</p>
    <a href="/">Voltar ao Início</a>
  </div>
</body>
</html>
